name: "mock-github-search"
capability_tags:
  - "github-search"
input_schema:
  type: "object"
  properties:
    query:
      type: "string"
      description: "GitHub search query"
    sort:
      type: "string"
      enum: ["stars", "forks", "updated"]
      default: "stars"
    per_page:
      type: "integer"
      minimum: 1
      maximum: 100
      default: 10
  required: ["query"]
output_schema:
  type: "object"
  properties:
    total_count:
      type: "integer"
    items:
      type: "array"
      items:
        type: "object"
        properties:
          name:
            type: "string"
          full_name:
            type: "string"
          description:
            type: "string"
          stargazers_count:
            type: "integer"
          html_url:
            type: "string"
        required: ["name", "full_name", "html_url"]
required: ["total_count", "items"]
required_scope: "github:search"
priority: 10