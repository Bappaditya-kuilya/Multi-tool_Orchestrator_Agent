name: "mock-wikipedia"
capability_tags:
  - "wikipedia"
input_schema:
  type: "object"
  properties:
    query:
      type: "string"
      description: "Search query or article title"
  required: ["query"]
output_schema:
  type: "object"
  properties:
    title:
      type: "string"
    summary:
      type: "string"
    url:
      type: "string"
required: ["title", "summary", "url"]
required_scope: "wikipedia:read"
priority: 10